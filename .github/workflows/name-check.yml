name: Name check

# Asks the registries themselves whether names are taken: Verisign's RDAP for
# .com, SWITCH's RDAP for .ch. 404 = not registered. Temporary; removed after use.
on:
  workflow_dispatch:
    inputs:
      names:
        description: "space-separated names, without TLD"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          NAMES: ${{ inputs.names }}
        run: |
          free=""; part=""; taken=""
          for n in $NAMES; do
            [[ "$n" =~ ^[a-z0-9-]{2,40}$ ]] || continue
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://rdap.verisign.com/com/v1/domain/$n.com")
            h=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://rdap.nic.ch/domain/$n.ch")
            s="$n(com:$([ "$c" = 404 ] && echo FREE || echo $c) ch:$([ "$h" = 404 ] && echo FREE || echo $h))"
            if [ "$c" = 404 ] && [ "$h" = 404 ]; then free="$free $s"; elif [ "$c" = 404 ] || [ "$h" = 404 ]; then part="$part $s"; else taken="$taken $s"; fi
            sleep 1
          done
          echo "::notice::BOTH FREE:$free"
          echo "::notice::ONE FREE:$part"
          echo "::notice::TAKEN:$taken"
