name: Box discover

# Read-only: reports the host layout Causius's provisioning needs. Prints
# names, paths and yes/no only; never a value from an env file.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Look
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          IP=167.233.22.31
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id -o BatchMode=yes "ubuntu@$IP" 'bash -s' > out.txt 2>&1 <<'REMOTE'
          echo "docker: $(sudo -n docker ps --format '{{.Names}}' 2>/dev/null | tr '\n' ' ')"
          for f in /opt/causius/shared/.env /opt/causius/app/.env; do [ -f "$f" ] && echo "$f keys: $(cut -d= -f1 "$f" | grep -v '^#' | tr '\n' ' ')"; done
          for f in /opt/orangecat/shared/.env /opt/orangecat/app/.env /opt/orangecat/app/.env.local /opt/orangecat/app/.env.selfhost.local /home/ubuntu/dev/orangecat/.env.selfhost.local; do [ -f $f ] && echo "oc [$f]: $(cut -d= -f1 $f | grep -E 'SUPABASE|OWNER|DATABASE' | tr '\n' ' ')"; done
          echo "units: $(systemctl list-units --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -E 'orangecat|causius|heidi' | tr '\n' ' ') | causius unit: $(systemctl cat causius 2>/dev/null | grep -E 'EnvironmentFile|ExecStart|WorkingDirectory' | tr '\n' ' ')"
          echo "dbcreds line format: $(head -1 ~/.db-credentials | sed -E 's/[^|]+/X/g')"
          echo "owner-gate: $(grep -n 'ORANGECAT_OWNER_SEED\|process.env' /home/ubuntu/dev/orangecat/scripts/lib/owner-gate.ts 2>/dev/null | head -5 | tr '\n' ' ' | cut -c1-300)"
          REMOTE
          rm -f ~/.ssh/id
          while IFS= read -r line; do echo "::notice::$line"; done < out.txt
