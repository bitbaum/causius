# pnpm 11 refuses to run a dependency's build script unless it is approved here,
# and it EXITS NON-ZERO when one is unapproved — so without this file a fresh
# scaffold cannot install at all, the deploy dies before it reaches the build,
# and the brand-new site serves 502 from a fully provisioned host.
#
# Both of these need their build step:
#   sharp          native image codec; next uses it for image optimisation
#   unrs-resolver  native module resolver used by eslint-config-next
#
# This lives here and NOT in package.json's "pnpm" field: pnpm 11 no longer
# reads that field and ignores it with a warning, which makes the setting look
# present while doing nothing — a checker grepping for the key would pass.
#
# Diplodoctor hit exactly this on 2026-09-10 and fixed it in its own repository.
# The template is where it belongs, so the next site does not rediscover it.
allowBuilds:
  # listkit is git-hosted and builds on install; allowed by its exact commit.
  listkit@git+https://github.com/bitbaum/listkit.git#69cb4f4ef12d6a2a56b56db1bb4d4ac14aced525: true
  listkit@https://codeload.github.com/bitbaum/listkit/tar.gz/69cb4f4ef12d6a2a56b56db1bb4d4ac14aced525: true
  sharp: true
  unrs-resolver: true
  # Arrived with next-intl. Both ship prebuilt binaries, so their install
  # scripts are not needed — but pnpm 11 exits non-zero on a build script that
  # is neither approved nor refused, and the deploy dies. Refused explicitly,
  # as Solon does. esbuild came with Vitest and does need its script.
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
minimumReleaseAgeExclude:
  - '@bitbaum/chatkit@0.12.0 || 0.13.0 || 0.16.0 || 0.17.0 || 0.17.1 || 0.18.0 || 0.19.0 || 0.20.0 || 0.20.1 || 0.21.0 || 0.21.1 || 0.21.2'
  - '@bitbaum/design-tokens@1.2.0'
  - '@bitbaum/listkit@0.2.1 || 0.2.2'
  - '@bitbaum/searchkit@0.2.2 || 0.2.3'
  - bip-kit@0.6.1
  - '@bitbaum/accountkit@0.8.0 || 0.8.1 || 0.9.0 || 0.9.1 || 0.10.0 || 0.11.0 || 0.12.0 || 0.13.0 || 0.14.0'
  - limitkit@0.2.1
  - '@bitbaum/ai-kit@1.21.5'
